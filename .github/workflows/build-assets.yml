name: Build Laravel Vite Assets

on:
  push:
    branches:
      - codex/flutterwave-wallet-nin-fixes
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install
      - run: npm run build

      - name: Commit built assets
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/build
          git commit -m "Build frontend assets" || echo "No changes to commit"
          git push
