name: Build Laravel Vite Assets

on:
  push:
    branches:
      - codex/flutterwave-wallet-nin-fixes
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci
      - run: npm run build
